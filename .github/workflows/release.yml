name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target x86_64-pc-windows-msvc --features custom-protocol

      - name: Package portable Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableDir = Join-Path $env:RUNNER_TEMP 'ScreenTrans-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/ScreenTrans.exe' (Join-Path $portableDir 'ScreenTrans.exe')
          @'
          ScreenTrans Windows 便携版

          无需安装，解压后直接运行 ScreenTrans.exe。
          Windows 10/11 通常已内置 Microsoft Edge WebView2 Runtime；若启动失败，
          请安装 Evergreen WebView2 Runtime 后重试：
          https://developer.microsoft.com/microsoft-edge/webview2/
          '@ | Set-Content -Encoding utf8 (Join-Path $portableDir 'README.txt')
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath 'ScreenTrans-windows-x64-portable.zip' -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screentrans-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ScreenTrans-windows-x64-portable.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            ScreenTrans-windows-x64-portable.zip
          generate_release_notes: true
